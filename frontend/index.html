<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Control | Biometric Security Project</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="access-page">
    <header class="access-header">
        <div class="brand">
            <span class="icon-box brand-icon">
                <img src="/static/assets/shield.svg" width="20" height="20" alt="">
            </span>
            <strong>Biometric Security Project</strong>
        </div>
        <a class="button access-link" href="/dashboard/">
            Security Dashboard
            <img src="/static/assets/chevron.svg" width="15" height="15" alt="">
        </a>
    </header>

    <main class="access-content">
        <section class="access-card" aria-labelledby="access-title">
            <span class="icon-box access-icon">
                <img src="/static/assets/metric-lock.svg" width="19" height="19" alt="">
            </span>
            <div class="access-summary">
                <h1 id="access-title">Access Control</h1>
                <p>Verify your identity using the biometric security system</p>
            </div>
            <a class="button access-link access-primary" href="/auth/">
                Authentication status
                <img src="/static/assets/chevron.svg" width="15" height="15" alt="">
            </a>
        </section>
    </main>
</body>
</html>
